# Perfil de producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator mínimamente expuesto
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logs a nivel INFO (los errores van a logback-spring.xml)
logging.level.com.example.demo=INFO
logging.level.org.flywaydb=WARN

# En producción la BD y los secretos deben venir por variables de entorno.
# Estas líneas no tienen valor por defecto a propósito: si falta alguna,
# la aplicación falla al arrancar en lugar de usar un default conocido
# (DB_PASSWORD root/root, jwt.secret del repo, app.credenciales-key del repo).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
app.credenciales-key=${CREDENCIALES_KEY}
