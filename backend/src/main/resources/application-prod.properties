# Perfil de producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Actuator mínimamente expuesto
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logs a nivel INFO (los errores van a logback-spring.xml)
logging.level.com.example.demo=INFO
logging.level.org.flywaydb=WARN

# En producción la BD y el secreto JWT deben venir por variables de entorno
# DB_URL, DB_USER, DB_PASSWORD, JWT_SECRET (no usar los defaults de base)
