spring.application.name=saas-backend
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# CONEXIÓN A BASE DE DATOS (MySQL)
# createDatabaseIfNotExist=true crea la BD si no existe
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/saas_final?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / HIBERNATE
# validate: el esquema lo controla Flyway (V1__schema.sql, V2__seed.sql)
# ===============================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# FLYWAY (migraciones versionadas)
# Si la BD ya tiene tablas sin historial de Flyway, borrar la BD
# (DROP DATABASE saas_final) para que migre limpio, o activar:
# spring.flyway.baseline-on-migrate=true y spring.flyway.baseline-version=0
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ===============================
# JWT (usar variable de entorno en producción)
# ===============================
jwt.secret=${JWT_SECRET:mi_clave_super_secreta_2026_muy_larga_para_evitar_errores}

# ===============================
# ACTUATOR (mínimo por defecto; dev/prod ajustan)
# ===============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}

# ===============================
# MERCADO PAGO (pagos de la tienda pública)
# ===============================
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.public-key=${MP_PUBLIC_KEY:}
mercadopago.base-url=${MP_BASE_URL:http://localhost:8080}

# ===============================
# PAYPAL (sandbox; credenciales de https://developer.paypal.com/dashboard)
# ===============================
paypal.client-id=${PAYPAL_CLIENT_ID:}
paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.return-url=${PAYPAL_RETURN_URL:http://localhost:8080/api/pagos/paypal/retorno}
paypal.cancel-url=${PAYPAL_CANCEL_URL:http://localhost:8080/api/pagos/paypal/cancelar}

# ===============================
# MAIL (envío de recibos; opcional, si no hay SMTP no se envía)
# ===============================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# TIENDA PÚBLICA (empresa por defecto servida en /inicio.html, /tienda.html)
# ===============================
app.tienda.empresa-id=${TIENDA_EMPRESA_ID:1}
app.base-url=${APP_BASE_URL:http://localhost:8080}

# URL del frontend React (a donde redirige el retorno de pago)
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}

# ===============================
# CLOUDINARY (imágenes de productos/banners/contenido)
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
