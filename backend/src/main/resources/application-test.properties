# Perfil para tests de integración (BD propia, se crea si no existe)
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/saas_final_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.show-sql=false

# Flyway migra el esquema + seeds en cada corrida de tests
spring.flyway.clean-disabled=false

# Límite alto para no interferir con los tests (el filtro aplica igual)
saas.login.rate-limit=1000
